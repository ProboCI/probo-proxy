# port that the proxy server is running on
port: 3050

# You will not need to change this unless you are hosting Probo inside a docker container.
# If you are not doing that, do not change this value. If you are, this needs to be
# changed to the intranet IP of the host machine or VM.
hostname: localhost

# server timeout, in any unit
serverTimeout: 10m

# Host for the container lookup service that maps a build id to a host/port to proxy to
containerLookupHost: "http://localhost:3000"

# Specifies if the lookup cache is enabled.
cacheEnabled: true

# Max number of proxy lookup responses to cache. Defaults to 500
cacheMax: 500

# Max age of proxy lookup responses in cache, in any unit (units default to ms). Defaults to 5 min
cacheMaxAge: 1s

# Log file path. If set, logs are written to a rotating file instead of stdout.
# logFile: '/var/log/probo/probo-proxy.log'

# Log rotation period (e.g. '1d', '1w', '6h'). Defaults to '1d'.
# logRotatePeriod: '1d'

# Number of rotated log files to keep. Defaults to 14.
# logRotateCount: 14

# Log level: trace, debug, info, warn, error, fatal. Defaults to 'debug'.
# logLevel: 'debug'

redirectUrl: ''

custom404Html: '<h1>404 - Build Not Found</h1><p>The build could not be found</p>'

# Health check: probe the container before routing any request to it. If the
# container is not answering yet, browsers get an auto-refreshing "activating"
# screen and everything else a 503, instead of a proxy error. Concurrent
# requests for the same container share one probe. Set to false to route
# without probing.
healthCheckEnabled: true

# Timeout for the health check probe, in any unit. Defaults to 5s.
healthCheckTimeout: 5s

# Path to probe instead of the container root. Set this if a build's root path
# does not reliably return 2xx/3xx when ready (e.g. it 404s at '/'). Resolved
# against the container origin, so '/health' probes https://<host>:<port>/health.
# Leave unset to probe '/'.
healthCheckPath: '/healthcheck'

# How long a passing health check is cached per container, in any unit. The key
# is the container origin (host:port), so one passing probe marks the container
# healthy for every path. During this window requests skip the probe. Failures
# are never cached. Defaults to 30m.
healthCheckCacheMaxAge: 30m

# Max number of containers to track in the health check cache. Defaults to 500.
healthCheckCacheMax: 500

# Auto-refresh interval (seconds) on the "build is activating" screen, also sent
# as the Retry-After header. Defaults to 3.
healthCheckRefreshSeconds: 3

# HTML template for the "build is activating" screen. Placeholders {{message}},
# {{refresh}}, and {{title}} are substituted at render time. Defaults to the
# bundled navy Probo.CI template (templates/activating.html). Point this at your
# own file to fully restyle the page.
# activatingTemplate: '/etc/probo/activating.html'

# Message shown on the activating screen (the {{message}} placeholder), also
# used for the JSON/plain-text 503 responses.
# activatingMessage: 'Your build is spinning up and will be ready in a moment.'

# Title (browser tab / {{title}} placeholder) for the activating screen.
# activatingTitle: 'Build activating'

# Rate limit: count requests per base URL (host + path, query string ignored)
# and, once a base URL exceeds rateLimitMax hits within rateLimitWindow,
# black-hole it for rateLimitBlockDuration. Black-holed requests are dropped
# before any lookup, health check, or proxying happens. Purely in-memory; no
# database or lookup-service call is involved in the decision.
rateLimitEnabled: true

# Hits per base URL per window before it is black-holed. Defaults to 100.
rateLimitMax: 100

# Counting window, in any unit. Defaults to 1m.
rateLimitWindow: 1m

# How long a tripped base URL stays black-holed, in any unit. Defaults to 10m.
rateLimitBlockDuration: 10m

# What a black-holed request gets: 'drop' closes the connection with no
# response at all; '429' sends a bare 429 Too Many Requests with Retry-After.
rateLimitAction: drop

# If true, only requests carrying a query string count toward the limit, so
# plain page loads of a path never trip it but facet-style crawls do.
rateLimitQueryOnly: false

# Max number of base URLs tracked in memory. Defaults to 10000.
rateLimitCacheMax: 10000
