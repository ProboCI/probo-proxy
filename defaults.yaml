# port that the proxy server is running on
port: 3050

# You will not need to change this unless you are hosting Probo inside a docker container.
# If you are not doing that, do not change this value. If you are, this needs to be
# changed to the intranet IP of the host machine or VM.
hostname: localhost

# server timeout, in any unit
serverTimeout: 10m

# Host for the container lookup service that maps a build id to a host/port to proxy to
containerLookupHost: "http://localhost:3000"

# Specifies if the lookup cache is enabled.
cacheEnabled: true

# Max number of proxy lookup responses to cache. Defaults to 500
cacheMax: 500

# Max age of proxy lookup responses in cache, in any unit (units default to ms). Defaults to 5 min
cacheMaxAge: 1s

# Log file path. If set, logs are written to a rotating file instead of stdout.
# logFile: '/var/log/probo/probo-proxy.log'

# Log rotation period (e.g. '1d', '1w', '6h'). Defaults to '1d'.
# logRotatePeriod: '1d'

# Number of rotated log files to keep. Defaults to 14.
# logRotateCount: 14

# Log level: trace, debug, info, warn, error, fatal. Defaults to 'debug'.
# logLevel: 'debug'

redirectUrl: ''

custom404Html: '<h1>404 - Build Not Found</h1><p>The build could not be found</p>'

# Health check: probe the container before routing a browser navigation to it.
# If the container is not answering yet, show an auto-refreshing "activating"
# screen instead of a proxy error. Set to false to route without probing.
healthCheckEnabled: true

# Timeout for the health check probe, in any unit. Defaults to 5s.
healthCheckTimeout: 5s

# Path to probe instead of the container root. Set this if a build's root path
# does not reliably return 2xx/3xx when ready (e.g. it 404s at '/'). Resolved
# against the container origin, so '/health' probes https://<host>:<port>/health.
# Leave unset to probe '/'.
healthCheckPath: '/healthcheck'

# How long a passing health check is cached per target URL, in any unit.
# During this window requests skip the probe. Failures are never cached.
# Defaults to 30s.
healthCheckCacheMaxAge: 30s

# Max number of target URLs to track in the health check cache. Defaults to 500.
healthCheckCacheMax: 500

# Auto-refresh interval (seconds) on the "build is activating" screen, also sent
# as the Retry-After header. Defaults to 3.
healthCheckRefreshSeconds: 3

# Optional custom HTML body for the "activating" screen (wrapped in a page that
# supplies the auto-refresh meta tag).
# activatingHtml: '<h1>Your build is activating</h1>'
