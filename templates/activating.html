<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="{{refresh}}">
  <title>{{title}}</title>
  <style>
    :root {
      --navy: #0f1f44;
      --navy-dark: #0a2342;
      --navy-mid: #192244;
      --gold: #f5b318;
      --text: #ffffff;
      --muted: #a9b4cc;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 20%, var(--navy-mid) 0%, var(--navy) 45%, var(--navy-dark) 100%);
    }
    .card {
      width: 100%;
      max-width: 30rem;
      text-align: center;
    }
    .logo {
      width: 405px;
      max-width: 80%;
      height: auto;
      margin: 0 auto 2rem;
      display: block;
      filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.35));
    }
    .message {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--muted);
      margin: 0 auto 2rem;
      max-width: 28rem;
      text-wrap: balance;
    }
    .dots {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.75rem;
    }
    .dots span {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: var(--gold);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-0.3rem); }
    }
    .foot {
      font-size: 0.8rem;
      color: var(--muted);
      opacity: 0.75;
    }
    @media (prefers-reduced-motion: reduce) {
      .dots span { animation: none; opacity: 0.8; }
    }
  </style>
</head>
